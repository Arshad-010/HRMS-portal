<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>
    <linearGradient id="fav-leader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="60%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fav-collab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C084FC" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <linearGradient id="fav-growth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34D399" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="fav-bridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#7C3AED" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#fav-bg)" stroke="#334155" stroke-width="1.2" />

  <!-- Left collaborator (Violet) -->
  <circle cx="14" cy="18" r="3.25" fill="url(#fav-collab)" />
  <path d="M7 35.5 C7.5 28.5, 13 25.5, 17 28.5 C15 31.5, 12 34.5, 7 35.5 Z" fill="url(#fav-collab)" />

  <!-- Right team partner (Growth green) -->
  <circle cx="34" cy="18" r="3.25" fill="url(#fav-growth)" />
  <path d="M41 35.5 C40.5 28.5, 35 25.5, 31 28.5 C33 31.5, 36 34.5, 41 35.5 Z" fill="url(#fav-growth)" />

  <!-- Center rising leader (Corporate blue) -->
  <circle cx="24" cy="11.5" r="4.25" fill="url(#fav-leader)" />
  <path d="M16.5 35.5 C17.5 25, 21.5 20, 24 17.5 C26.5 20, 30.5 25, 31.5 35.5 C27.5 32.5, 20.5 32.5, 16.5 35.5 Z" fill="url(#fav-leader)" />

  <!-- Upward horizon base bridge -->
  <path d="M11 38.5 C18 34, 30 34, 37 38.5" stroke="url(#fav-bridge)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Growth peak accent sparkle -->
  <circle cx="38.5" cy="9.5" r="2.2" fill="#10B981" />
</svg>